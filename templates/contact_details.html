<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Details | SwapNest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Contact Details</h2>
        <p>Update the phone number buyers can use to contact you.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="phone">Phone number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                value="{{ user.phone or '' }}"
                maxlength="20"
                placeholder="Enter your contact number"
            >
            <button type="submit">Save Contact Details</button>
        </form>

        <p><a href="{{ url_for('account') }}">Back to My Account</a></p>
    </div>
</body>
</html>
